<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Calibration / Settings</title>
  <style>body{font-family:Arial;background:#111;color:#eee;padding:12px} label{display:block;margin-top:8px}</style>
</head>
<body>
  <h2>Calibration & Settings</h2>
  <form id="calform">
    <label>EAR threshold:
      <input type="number" step="0.001" id="ear" value="{{ cal.ear_threshold }}">
    </label>
    <button type="submit">Save</button>
  </form>
  <div id="result"></div>
<script>
const form = document.getElementById("calform");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const ear = parseFloat(document.getElementById("ear").value);
  const payload = { ear_threshold: ear };
  const res = await fetch("/calibration", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
  const j = await res.json();
  document.getElementById("result").innerText = j.ok ? "Saved." : "Failed.";
});
</script>
</body>
</html>
